<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treinando Imagens dinâmicas</title>
</head>
<body>
    <h1>Imagens dinâmicas</h1>
    <p>Aumente/Diminua o zoom, ou, aumente/diminua a largura da tela</p>
    <picture>
        <source media="(max-width: 750px)" srcset="Imagens/Imagem-300.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="Imagens/Imagem-700.png" type="image/png">
        <img src="Imagens/Imagem-1000.png" alt="Imagem dinâmica">
    </picture>
</body>
</html>
