<!DOCTYPE html>

<head>

    <title>Exercícios de Tabelas</title>
    <style>

        body {

            font-family: Arial, Helvetica, sans-serif;

        }

        table{
            border-collapse: collapse;

            width: 500px;

        }

        caption{

            font-size: 1.3em;
            font-weight: bold;

            padding: 8px;

        }

        th, td{

            border: 1px solid black;

            padding: 8px;

        }

        .amarelo{

        }

        .vermelho{

        }

        a#voltar{

            left: 2px;

        }

        a#proxima{
