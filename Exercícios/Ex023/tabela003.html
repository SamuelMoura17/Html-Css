<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }   

        table{
            border-collapse: collapse;

            width: 300px;
        }

        td{
            border: 1px solid black;

            padding: 10px;

            text-align: center;
        }

        a#voltar{

            position: absolute;
            bottom: 0;
            left: 2px;

        }

        a#proxima{

            position: absolute;
            bottom: 0;
            right: 2px;

        }
    </style>
</head>
<body>
    <h1>Mesclagem de Células</h1>

    <table>

        <tr>

            <td>A</td>

            <td colspan="2">B</td>


        </tr>

        <tr>

            <td rowspan="3">D</td>

            <td>E</td>

            <td rowspan="2">F</td>
        </tr>

        <tr>


            <td>H</td>

        </tr>

        <tr>

            <td colspan="2">M</td>

        </tr>

    </table>

    <footer>

        <a href="tabela002.html" id="voltar">Voltar</a>

        <a href="tabela004.html" id="proxima">Próxima</a>

    </footer>
</body>
</html>
