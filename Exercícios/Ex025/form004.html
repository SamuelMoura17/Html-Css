<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    
    <Fieldset>

        <legend>Dados pessoais</legend>

        <form action="cadastro.js" method="get" autocomplete="on">

            <p>

            <label for="inome">Nome:</label>

            <input type="text" name="nome" id="inome" minlength="5" maxlength="20" required>

            </p>

            <p>

            <label for="iemail">E-mail:</label>

            <input type="email" name="email" id="iemail" autocomplete="email" pattern="\d{}" required>

            </p>

            <!-- Estudar mais sobre RegEx -->

            <p>

            <label for="itel">Telefone</label>

            <input type="tel" name="tel" id="itel" autocomplete="tel" pattern="^\(\d{2}\)\d{2} \d{4,5}-\d{4}$" required placeholder="(xx)xx xxxxx-xxxx">

            </p>

            <p>

            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">

            </p>

        </form>
    
    </Fieldset>
        
</body>
</html>
