<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formuário</title>
    <style>

        a#voltar{

            text-decoration: none;

            color: black;

            position: absolute;

            bottom: 0;
            left: 0;

            margin-left: 10px;

            font-size: 17px;

        }

    </style>
</head>
<body>
    
    <h1>Teste de Formulário</h1>

    <form action="cadastro.js" method="get" autocomplete="on">

        <p>

            <label for="inome">Nome:</label>

            <input type="text" name="nome" id="inome" required maxlength="30" placeholder="Nome completo" autocomplete="name">

        </p>

        <p>

            <label for="imedia">Média:</label>

            <input type="number" name="media" id="imedia" required min="0" max="10" placeholder="0 a 10" step="0.1" value="5">

        </p>

        <p>

            <label for="imes">Período Letivo</label>

            <input type="month" name="mes" id="imes" required value="2026-04">

        </p>

        <p>

            <label for="idia">Dia da Prova:</label>

            <input type="date" name="dia" id="idia" required value="2026-04-26">

        </p>

        <p>

            <label for="ihora">Hora da Prova</label>

            <input type="time" name="hora" id="ihora" required value="22:31">

        </p>

        <p>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">

        </p>

    </form>

        <a href="form002.html" id="voltar">
            
            <p>Voltar</p>
        </a>

    </footer>

</body>
</html>
