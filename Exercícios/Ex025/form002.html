<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form002</title>
    <style>

        a#avancar{

            text-decoration: none;

            color: black;

            position: absolute;

            bottom: 0;
            right: 0;

            margin-right: 10px;

            font-size: 17px;

        }

        a#voltar{

            text-decoration: none;

            color: black;

            position: absolute;

            bottom: 0;
            left: 0;

            margin-left: 10px;

            font-size: 17px;

        }

    </style>
</head>
<body>

    <h1>Teste de Formulário</h1>

    <form action="cadastro.js" method="POST" autocomplete="on">

        <p>

            <label for="iusuario">Usuário:</label>

            <input type="text" name="usu" id="iusuario" required minlength="5" maxlength="15" size="10" placeholder="Nome de Usuário:" autocomplete="username">

        </p>

        <p>

            <label for="isen">Senha:</label>

            <input type="password" name="sen" id="isen" required minlength="8" size="8" placeholder="Digite sua Senha:" autocomplete="current-password">

        </p>

        <p>
            
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        
        </p>

    </form>

    <footer>

        <a href="form003.html" id="avancar">
            
            <p>Avançar</p>
        </a>

    </footer>
    
    <footer>

        <a href="index.html" id="voltar">
            
            <p>Voltar</p>
        </a>

    </footer>

</body>
</html>
