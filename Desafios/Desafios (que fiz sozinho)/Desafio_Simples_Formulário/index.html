<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Formulário de Cadastro de Usuário</title>
    <style>

        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');

        *{

            font-family: "Inter", sans-serif;

        }

        body{

            background: linear-gradient(to right, #E84E00, #FF9A3C);

        }

        h1{

            text-align: center;

            color: #FFFFFF;
            text-shadow: 0 2px 8px rgba(150, 60, 0, 0.4);
            
            font-size: 46px;

            margin-bottom: 50px;

            font-family: 'Playfair Display', serif;

        }

        form{

            background-color: rgb(243, 242, 242);

            width: 75%;

            margin: auto;
            padding: 20px;

            border-radius: 20px;

            box-shadow: 0 0 0 3px rgba(255,255,255,0.5),
            0 8px 24px rgba(150,60,0,0.3);

        }

        h2.sub, h2{
            
            font-family: 'Playfair Display', serif;
            font-size: 30px;

            color: #333333;

            margin: 35px 0 35px 0;

            text-align: center;

        }

        h3{

            font-weight: bold;
            font-family: 'Playfair Display', serif;
            font-size: 25px;

        }

        
        p.paragrafos{

            font-size: 20px;

            margin: 10px;

        }


        label{

            display: inline-block;

            margin: 4px;

        }

        input.inputs{

            width: clamp(318px, 90%, 2000px);

            display: block;

            margin: 15px auto 5px auto;
            padding: 7px;

        }    

        div#informar{

            position: relative;

            display: inline-block;

            margin-left: clamp(5px, 4%, 100px);

        }


        input#enviar{

            background-color: #E84E00;

            color: #FFFFFF;

            border: none;

            padding: 10px 15px;

            border-radius: 5px;

            cursor: pointer;

            font-size: 15px;

            margin-top: 30px;

            box-shadow: 0 4px 16px rgba(180, 80, 0, 0.4);

        }

        input#enviar:hover{
            
            transition: 0.3s;

            padding: 13px 18px;

            font-size: 17px;

            box-shadow: 0 6px 24px rgba(180, 80, 0, 0.55);

            transform: translateY(-2px)

        }

    </style>
</head>
<body>
    
    <h1>Formulário de Cadastro de Usuário</h1>

    <form action="cadastro.js" autocomplete="on" method="POST">

        <h2 class="sub">Dados Pessoais</h2>

        <p class="paragrafos"><label for="nome">Nome Completo:</label> 
            
            <input type="text" id="nome" class="inputs" minlength="5" maxlength="40" placeholder="Nome de Usuário" required autocomplete="name">
        
        </p>

        <p class="paragrafos"><label for="data">Data de Nascimento:</label> 
            
            <input type="date" id="data" class="inputs" min="1900-01-01" max="2026-04-26" required auytocomplete="bday">
        
        </p>

        <h3>Calculando idade</h3>

        <p>

            <label for="iano">Ano de Nascimento:</label>

            <input type="number" name="ano" id="iano" min="1900" max="2026" required oninput="calcIdade()">
            
            <label for="iidade">Sua idade esse ano é: </label>

            <output id="iidade">0</output>


        </p>


        <p class="paragrafos"><label for="icidade" style="margin-bottom: 20px; margin-top: 20px;">Estado:</label>
        
            <select name="cidade" id="icidade" class="inputs" required>

                <option value="">Escolha uma opção</option>

                <optgroup label="Norte">

                    <option value="AC">Acre</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="PA">Pará</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="TO">Tocantins</option>

                </optgroup>

                <optgroup label="Nordeste">

                    <option value="AL">Alagoas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="MA">Maranhão</option>
                    <option value="PB">Paraíba</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="SE">Sergipe</option>

                </optgroup>

                <optgroup label="Centro-Oeste">

                    <option value="DF">Distrito Federal</option>
                    <option value="GO">Goiás</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>

                </optgroup>

                <optgroup label="Sudeste">

                    <option value="ES">Espírito Santo</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="SP">São Paulo</option>

                </optgroup>   

                <optgroup label="Sul">

                    <option value="PR">Paraná</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="SC">Santa Catarina</option>

                </optgroup>

            </select>

            <p class="paragrafos"><label for="iprofi" style="margin-bottom: 20px;">Profissão:</label>

                <input type="text" name="profi" id="iprofi" list="iprofissao" class="inputs" placeholder="Digite sua profissão" required autocomplete="organization-title">
            
                <datalist id="iprofissao">

                    <option value="Programador">
                    <option value="Designer">
                    <option value="Analista">
                    <option value="Gerente">
                    <option value="Engenheiro">
                    <option value="Médico">
                    <option value="Professor">
                    <option value="Advogado">
                    <option value="Arquiteto">
                    <option value="Jornalista">
                    <option value="Psicólogo"> 
                    <option value="Dentista">
                    <option value="Veterinário">
                    <option value="Farmacêutico">
                    <option value="Contador">
                    <option value="Publicitário">
                    <option value="Consultor">  

                </datalist>
            
            </p>

        </p>

        <p class="paragrafos"><label for="sexo" style="margin-bottom: 10px;">Gênero</label> <br>
            
            <input type="radio" name="sexo" id="imasculino" value="M" required autocomplete="sex"> 
            <label for="imasculino" style="font-size: 16px;">Masculino</label> <br>

            <input type="radio" name="sexo" id="ifeminino" value="F" required autocomplete="sex">
            <label for="ifeminino" style="font-size: 16px;">Feminino</label> <br>

            <input type="radio" name="sexo" id="ioutro" value="O" required autocomplete="sex">
            <label for="ioutro" style="font-size: 16px;">Outro</label> <br>

            <input type="radio" name="sexo" id="inao_dizer" value="N" required autocomplete="sex">
            <label for="inao_dizer" style="font-size: 16px;">Prefiro não informar</label>

        </p>

        <h2 class="sub">Contato</h2>

        <p class="paragrafos"><label for="email">Email:</label> 
            
            <input type="email" id="email" class="inputs" required autocomplete="email" maxlength="100" placeholder="seu.email@exemplo.com" pattern="^\@\{5}+.\{3}$">
        
        </p>

        <p class="paragrafos"><label for="telefone">Telefone:</label> 
            
            <input type="tel" id="telefone" class="inputs" required autocomplete="tel" pattern="^\(\d{2}\)\d{2} \d{4,5}-\d{4}$" placeholder="(xx)xx xxxxx xxxxx" value="(xx)xx xxxxx-xxxx">
        
        </p>

        <h2 class="sub">Acesso</h2>

        <p class="paragrafos"><label for="usuario">Usuário:</label> 
            
            <input type="text" id="usuario" class="inputs" required autocomplete="username" minlength="5" maxlength="30">
        
        </p>

        <p><label for="senha">Senha:</label>

            <input type="password" name="senha" id="isenha" class="inputs" required minlength="8" maxlength="20" autocomplete="new-password">

        </p>

        <p><label for="confirm">Confirmar Senha:</label>

            <input type="password" name="senha" id="iconfirm" class="inputs" required minlength="8" maxlength="20" autocomplete="current-password">

        </p>

        <h2 class="Sub">Feedback</h2>

        <p>

            <textarea name="msg" id="imsg" placeholder="Digite seu Feedback aqui....." rows="8" cols="120" required></textarea>

        </p>

        <p><label for="inivel">Nível de satisfação:</label>
        
            <input type="range" name="nivel" id="inivel" min="1" max="10" value="5" oninput="out.innerHTML = Number(inivel.value)" required> 

            <label for="out"></label>
            <output id="out">5</output>
            
        </p>

        <h2 class="sub">Adicionais</h2>

        <p><label for="in1">Digite o Primeiro Número: </label>
        
            <input type="number" name="n1" id="in1" oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)" placeholder="Digite um número" required>
            
        </p>

        <p>

            <label for="in2">Digite o Segundo Número: </label>
            
            <input type="number" name="n2" id="in2" oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)" placeholder="Digite outro número">

        </p>

        <p>

            <label for="isoma">A soma é: </label>

            <output id="isoma">0</output>

        </p>


        <p class="paragrafos"><label for="aceito">Aceito os termos de uso</label>

            <input type="checkbox" id="aceito" style="display: block; margin-left: 10px;" required>

        </p>

        <input type="submit" value="Enviar" id="enviar" style="margin-right: 10px;">
        <input type="reset" value="Limpar" id="enviar">

    </form>

    <script>

        function calcIdade(){

            let anoAtual = new Date().getFullYear();
            iidade.innerHTML = Number(anoAtual) - Number(iano.value);

        }

    </script>

</body>
</html>
