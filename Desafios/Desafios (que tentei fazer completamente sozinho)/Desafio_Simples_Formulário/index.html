<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Formulário de Cadastro de Usuário</title>
    <style>
        *{

            font-family: Arial, Helvetica, sans-serif;

        }

        body{

            background: linear-gradient(to right, #E84E00, #FF9A3C);

        }

        h1{

            text-align: center;

            color: #FFFFFF;
            text-shadow: 0 2px 8px rgba(150, 60, 0, 0.4);
            
            font-size: 40px;

            margin-bottom: 50px;

        }

        form{

            background-color: rgb(243, 242, 242);

            width: 75%;

            margin: auto;
            padding: 20px;

            border-radius: 20px;

            box-shadow: 0 0 0 3px rgba(255,255,255,0.5),
            0 8px 24px rgba(150,60,0,0.3);

        }

        h2.sub{

            color: #333333;

            margin: 30px 0 30px 0;

            font-size: 30px;

        }
        
        p.paragrafos{

            font-size: 20px;

        }


        label{

            display: inline-block;

            margin: 4px;

        }

        input.inputs{

            width: clamp(318px, 90%, 2000px);

            display: block;

            margin: 15px auto 5px auto;
            padding: 7px;

        }

        div#informar{

            position: relative;

            display: inline-block;

            margin-left: clamp(5px, 4%, 100px);

        }

        input#enviar{

            background-color: #E84E00;

            color: #FFFFFF;

            border: none;

            padding: 10px 15px;

            border-radius: 5px;

            cursor: pointer;

            font-size: 15px;

            margin-top: 30px;

            box-shadow: 0 4px 16px rgba(180, 80, 0, 0.4);

        }

        input#enviar:hover{
            
            transition: 0.3s;

            padding: 13px 18px;

            font-size: 17px;

            box-shadow: 0 6px 24px rgba(180, 80, 0, 0.55);

            transform: translateY(-2px)

        }

    </style>
</head>
<body>
    
    <h1>Formulário de Cadastro de Usuário</h1>

    <form autocomplete="off">

        <h2 class="sub">Dados Pessoais</h2>

        <p class="paragrafos"><label for="nome">Nome Completo:</label> 
            
            <input type="text" id="nome" class="inputs">
        
        </p>

        <p class="paragrafos"><label for="data">Data de Nascimento: (Adiciones os /)</label> 
            
            <input type="datetime" id="data" class="inputs">
        
        </p>

        <p class="paragrafos"><label for="genero">Gênero:</label> 
            
            <input type="text" id="genero" class="inputs" style="margin-bottom: -15px;">

            <div id="informar"><input type="checkbox" name="" id=""> Prefiro não informar.</div>
            
        
        </p>

        <h2 class="sub">Contato</h2>

        <p class="paragrafos"><label for="email">Email:</label> 
            
            <input type="email" id="email" class="inputs">
        
        </p>

        <p class="paragrafos"><label for="telefone">Telefone:</label> 
            
            <input type="tel" id="telefone" class="inputs">
        
        </p>

        <h2 class="sub">Acesso</h2>

        <p class="paragrafos"><label for="usuario">Usuário:</label> 
            
            <input type="text" id="usuario" class="inputs">
        
        </p>

        <p><label for="senha">Senha:</label>

            <input type="password" id="senha" class="inputs">

        </p>

        <p><label for="confirm">Confirmar Senha:</label>

            <input type="password" id="confirm" class="inputs">

        </p>

        <p class="paragrafos"><label for="aceito">Aceito os termos de uso</label>

            <input type="checkbox" id="aceito" style="display: block; margin-left: 10px;">

        </p>

        <input type="submit" value="Enviar" id="enviar">

    </form>

</body>
</html>
