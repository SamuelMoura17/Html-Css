<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Formulário de Cadastro de Usuário</title>
    <style>
        *{

            font-family: Arial, Helvetica, sans-serif;

        }

        body{

            background: linear-gradient(to right, #E84E00, #FF9A3C);

        }

        h1{

            text-align: center;

            color: #FFFFFF;
            text-shadow: 0 2px 8px rgba(150, 60, 0, 0.4);
            
            font-size: 40px;

            margin-bottom: 50px;

        }

        form{

            background-color: rgb(243, 242, 242);

            width: 75%;
            height: 150vh;

            margin: auto;
            padding: 20px;

            border-radius: 20px;

            box-shadow: 0 0 0 3px rgba(255,255,255,0.5),
            0 8px 24px rgba(150,60,0,0.3);

        }

        h2.sub{

            color: #333333;

            margin: 30px 0 30px 0;

            font-size: 30px;

        }
        
        p.paragrafos{

            font-size: 20px;

        }

        label{

            display: inline-block;

            margin: 4px;

        }

        input.inputs{

            width: 96%;

            display: block;

            margin: 10px;
            padding: 5px;

        }

    </style>
</head>
<body>
    
    <h1>Formulário de Cadastro de Usuário</h1>

    <form autocomplete="off">

        <h2 class="sub">Dados Pessoais</h2>

        <p class="paragrafos"><label for="nome">Nome:</label> 
            
            <input type="text" id="nome" class="inputs">
        
        </p>

        <p class="paragrafos"><label for="data">Data de Nascimento:</label> 
            
            <input type="date" id="data" class="inputs">
        
        </p>

        <p class="paragrafos"><label for="genero">Gênero:</label> 
            
            <input type="text" id="genero" class="inputs"> <p id="nao_dizer"><input type="checkbox" name="" id="caixa" class="inputs
"> Prefiro não dizer.</p>
        
        </p>

        <h2 class="sub">Contato</h2>

        <p class="paragrafos"><label for="email">Email:</label> 
            
            <input type="email" id="email" class="inputs">
        
        </p>

        <p class="paragrafos"><label for="telefone">Telefone:</label> 
            
            <input type="tel" id="telefone" class="inputs">
        
        </p>

        <h2 class="sub">Acesso</h2>

        <p class="paragrafos"><label for="usuario">Usuário:</label> 
            
            <input type="text" id="usuario" class="inputs">
        
        </p>

        <p><label for="senha">Senha:</label>

            <input type="password" id="senha" class="inputs">

        </p>

        <p class="paragrafos"><label for="aceito">Aceito os termos de uso</label>

            <input type="checkbox" id="aceito" style="display: block;">

        </p>

        <input type="submit" value="Enviar" id="enviar">

    </form>

</body>
</html>
