<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Formulário de Cadastro de Usuário</title>
    <style>

        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');

        *{

            font-family: "Inter", sans-serif;

        }

        body{

            background: linear-gradient(to right, #E84E00, #FF9A3C);

        }

        h1{

            text-align: center;

            color: #FFFFFF;
            text-shadow: 0 2px 8px rgba(150, 60, 0, 0.4);
            
            font-size: 46px;

            margin-bottom: 50px;

            font-family: 'Playfair Display', serif;

        }

        form{

            background-color: rgb(243, 242, 242);

            width: 75%;

            margin: auto;
            padding: 20px;

            border-radius: 20px;

            box-shadow: 0 0 0 3px rgba(255,255,255,0.5),
            0 8px 24px rgba(150,60,0,0.3);

        }

        h2.sub{
            
            font-family: 'Playfair Display', serif;

            color: #333333;

            margin: 30px 0 30px 0;

            font-size: 30px;

        }
        
        p.paragrafos{

            font-size: 20px;

        }


        label{

            display: inline-block;

            margin: 4px;

        }

        input.inputs{

            width: clamp(318px, 90%, 2000px);

            display: block;

            margin: 15px auto 5px auto;
            padding: 7px;

        }

        div#informar{

            position: relative;

            display: inline-block;

            margin-left: clamp(5px, 4%, 100px);

        }

        input#enviar{

            background-color: #E84E00;

            color: #FFFFFF;

            border: none;

            padding: 10px 15px;

            border-radius: 5px;

            cursor: pointer;

            font-size: 15px;

            margin-top: 30px;

            box-shadow: 0 4px 16px rgba(180, 80, 0, 0.4);

        }

        input#enviar:hover{
            
            transition: 0.3s;

            padding: 13px 18px;

            font-size: 17px;

            box-shadow: 0 6px 24px rgba(180, 80, 0, 0.55);

            transform: translateY(-2px)

        }

    </style>
</head>
<body>
    
    <h1>Formulário de Cadastro de Usuário</h1>

    <form action="cadastro.js" autocomplete="on">

        <h2 class="sub">Dados Pessoais</h2>

        <p class="paragrafos"><label for="nome">Nome Completo:</label> 
            
            <input type="text" id="nome" class="inputs" minlength="5" maxlength="20" placeholder="Nome de Usuário" required autocomplete="name">
        
        </p>

        <p class="paragrafos"><label for="data">Data de Nascimento:</label> 
            
            <input type="date" id="data" class="inputs" min="1900-01-01" max="2026-04-26" required>
        
        </p>

        <p class="paragrafos"><label for="genero">Gênero:</label> 
            
            <input type="text" id="genero" class="inputs" style="margin-bottom: -15px;" placeholder="Masculino, Feminino, Outro..." autocomplete="sex">

            <div id="informar"><input type="checkbox" name="naoinfo" id="inaoinfo"> Prefiro não informar.</div>
            
        
        </p>

        <h2 class="sub">Contato</h2>

        <p class="paragrafos"><label for="email">Email:</label> 
            
            <input type="email" id="email" class="inputs" required autocomplete="email">
        
        </p>

        <p class="paragrafos"><label for="telefone">Telefone:</label> 
            
            <input type="tel" id="telefone" class="inputs" required autocomplete="tel">
        
        </p>

        <h2 class="sub">Acesso</h2>

        <p class="paragrafos"><label for="usuario">Usuário:</label> 
            
            <input type="text" id="usuario" class="inputs" required autocomplete="username" minlength="5" maxlength="30">
        
        </p>

        <p><label for="senha">Senha:</label>

            <input type="password" id="senha" class="inputs" required minlength="8" maxlength="20" autocomplete="new-password">

        </p>

        <p><label for="confirm">Confirmar Senha:</label>

            <input type="password" id="confirm" class="inputs" required minlength="8" maxlength="20" autocomplete="current-password">

        </p>

        <p class="paragrafos"><label for="aceito">Aceito os termos de uso</label>

            <input type="checkbox" id="aceito" style="display: block; margin-left: 10px;" required>

        </p>

        <input type="submit" value="Enviar" id="enviar" style="margin-right: 10px;">
        <input type="reset" value="Limpar" id="enviar">

    </form>

</body>
</html>
