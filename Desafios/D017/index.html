<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio para praticar FlexBox</title>
    <style>

        *{

            margin: 0px;
            padding: 0px;

            box-sizing: border-box;

            font-family: Arial, Helvetica, sans-serif;

        }

        body{

            background-color: antiquewhite;

        }

        section{

            display: flex;

            height: 100vh;

            justify-content: center;
            align-items: center;

        }

        div#conteiner{

            display: flex;

            width: 35vw;
            height: 35vh;

            background-color: rgb(37, 114, 72);
            color: white;

            border-radius: 30px;

            justify-content: center;
            align-items: center;

        }

    </style>
</head>
<body>
    <main>

        <section>

            <div id="conteiner">

                <div id="card">

                    Samuel Moura Souza - 17 anos

                </div>

            </div>

        </section>    

    </main>
</body>
</html>
