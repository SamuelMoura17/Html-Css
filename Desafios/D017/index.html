<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio para praticar FlexBox</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <style>

        *{

            margin: 0px;
            padding: 0px;

            box-sizing: border-box;

            font-family: Arial, Helvetica, sans-serif;

        }

        body{

            background-color: antiquewhite;

        }

        section{

            display: flex;

            height: 100vh;

            justify-content: center;
            align-items: center;

        }

        div#conteiner{

            display: flex;

            width: 400px;
            height: 250px;

            padding: 10px;

            background-color: rgb(37, 114, 72);
            color: white;

            border-radius: 30px;

            flex-flow: column nowrap;

            justify-content: center;
            align-items: center;
            

        }

        div#topo{

            margin-bottom: auto;
            margin-top: auto;

        }

    </style>
</head>
<body>
    <main>

        <section>

            <div id="conteiner">

                    <div id="topo">
                        
                        <p><i class="material-icons">person</i> Samuel Moura Souza - 17 anos</p>
                        
                    </div>

                    <div id="rodape">

                        <p>Cedesp AeB</p>

                    </div>

            </div>

        </section>    

    </main>
</body>
</html>
