<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 14</title>
    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        h1{
            text-align: center;

            padding: 5px;
        }

        table{
            
            border-collapse: collapse;

            width: 500px;

            margin: auto;
        }

        thead {

            background-color: rgb(100, 100, 100);
            color: white;

            font-size: 17px;

        }

        tbody th{

            font-weight: normal;
        }

        tbody th.mat{

            text-align: center;

            font-weight: bold;
        }

        tr.cinza{

            background-color: rgb(100, 100, 100);

            color: white;

            font-size: 17px;

        }

        tr.cinza th{

            text-align: left;

            font-weight: bold;

        }

        th, tr, td{

            border: 2px solid rgb(43, 43, 43);

            text-align: center;

            padding: 15px;

        }

    </style>
</head>
<body>

    <h1>Exercício 14</h1>
    
    <table>

        <thead>

            <tr>

                <th rowspan="2" scope="col">Área</th>

                <th rowspan="2" scope="col">Disciplinas</th>

                <th colspan="2" scope="colgroup">Notas</th>

                <th rowspan="2" scope="col">Média</th>

            </tr>

            <tr>

                <th scope="col">Notas 1</th>

                <th scope="col">Notas 2</th>

            </tr>

        </thead>

        <tbody>

            <tr>

                <th rowspan="4" class="mat" scope="rowgroup">Exatas</th>

                <td>Matemática</td>

                <td>0.0</td>

                <td>0.0</td>

                <td>0.0</td>

            </tr>

            <tr>

                <td>Física</td>

                <td>0.0</td>

                <td>0.0</td>

            </tr>

            <tr>

                <th>Química</th>

                <td>0.0</td>

                <td>0.0</td>

                <td>0.0</td>

            </tr>

            <tr>

                <td>Biologia</td>

                <td>0.0</td>

                <td>0.0</td>

                <td>0.0</td>

            </tr>

            <tr class="cinza">

                <th colspan="4" scope="row">Média de Exatas</th>

                <td>0.0</td>

            </tr>

            <tr>

                <th rowspan="2" class="mat" scope="rowgroup">Humanas</th>

                <td>História</td>

                <td>0.0</td>

                <td>0.0</td>

                <td>0.0</td>

            </tr>

            <tr>

                <td>Geografia</td>

                <td>0.0</td>

                <td>0.0</td>

                <td>0.0</td>

            </tr>

            <tr class="cinza">

                <th colspan="4" scope="row">Média de Humanas</th>

                <td>0.0</td>

            </tr>

        </tbody>

    </table>

</body>
</html>
